# Versions start as a copy of Vesta's gradle/libs.versions.toml (kits extraction plan, WP12).
# Drift between the two repos is a known cost of separate repos.
[versions]
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "26"
automerge = "0.0.9"
binaryCompatibilityValidator = "0.18.1"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
androidx-sqlite = "2.7.1"
eygraber-sqldelightAndroidxDriver = "0.2.2"
sqldelight = "2.4.0"
skiko = "0.150.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# Used by build-logic only (convention plugins compile against these).
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
binaryCompatibilityValidator-gradlePlugin = { module = "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
kotlin-serializationGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

sqldelight-gradlePlugin = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }
# store-kit
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutinesExtensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-asyncExtensions = { module = "app.cash.sqldelight:async-extensions", version.ref = "sqldelight" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
eygraber-sqldelightAndroidxDriver = { module = "com.eygraber:sqldelight-androidx-driver", version.ref = "eygraber-sqldelightAndroidxDriver" }
# blobs-kit (the JVM photo encoder; compileOnly there, the desktop app brings Skia with Compose)
skiko-awt = { module = "org.jetbrains.skiko:skiko-awt", version.ref = "skiko" }
skiko-awtRuntimeLinuxX64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
